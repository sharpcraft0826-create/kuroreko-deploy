<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クロレコ デプロイツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  .logo { font-size: 28px; font-weight: 800; color: #E8201A; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
  .section { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .token-wrap { position: relative; }
  .token-wrap input {
    width: 100%;
    padding: 12px 44px 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: monospace;
  }
  .token-wrap input:focus { border-color: #E8201A; }
  .token-wrap .eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    user-select: none;
  }
  .token-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
  .upload-area {
    border: 2px dashed #ddd;
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafa;
  }
  .upload-area:hover, .upload-area.dragover { border-color: #E8201A; background: #fff5f5; }
  .upload-area .icon { font-size: 36px; margin-bottom: 8px; }
  .upload-area .text { color: #666; font-size: 14px; }
  .upload-area .hint { color: #aaa; font-size: 12px; margin-top: 4px; }
  .file-name {
    margin-top: 8px; padding: 8px 12px;
    background: #f0f8ff; border-radius: 8px;
    font-size: 13px; color: #333; display: none;
  }
  .btn {
    width: 100%; padding: 15px;
    background: #E8201A; color: white;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .log {
    margin-top: 14px; padding: 14px;
    background: #1a1a1a; border-radius: 10px;
    font-size: 12px; font-family: monospace;
    color: #00ff88; max-height: 160px;
    overflow-y: auto; display: none; line-height: 1.8;
  }
  .build-panel {
    margin-top: 14px; border: 1.5px solid #e5e7eb;
    border-radius: 12px; overflow: hidden; display: none;
  }
  .build-header {
    padding: 10px 14px; background: #f9fafb;
    font-size: 13px; font-weight: 600; color: #444;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 8px;
  }
  .build-status { padding: 12px 14px; font-size: 13px; color: #555; }
  .build-status .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .build-status .label { color: #888; min-width: 60px; font-size: 12px; }
  .build-status .value { font-weight: 600; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid #ddd; border-top-color: #E8201A;
    border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.running { background: #f59e0b; }
  .dot.success { background: #22c55e; }
  .dot.failure { background: #ef4444; }
  .dot.waiting { background: #94a3b8; }
  .open-link {
    display: none; text-align: center; margin-top: 10px;
    padding: 12px; background: #22c55e; color: white;
    border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none;
  }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">クロレコ</div>
  <div class="subtitle">デプロイツール</div>

  <div class="section">
    <label>GitHub Token</label>
    <div class="token-wrap">
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      <span class="eye" id="eyeBtn">👁</span>
    </div>
    <div class="token-hint">※ メモ帳からコピー&ペーストしてください</div>
  </div>

  <div class="section">
    <label>ZIPファイルを選択</label>
    <div class="upload-area" id="uploadArea">
      <div class="icon">📦</div>
      <div class="text">タップしてZIPを選択</div>
      <div class="hint">Claudeからダウンロードしたzipファイル</div>
    </div>
    <div class="file-name" id="fileName"></div>
    <input type="file" id="fileInput" accept=".zip">
  </div>

  <button class="btn" id="deployBtn" disabled>GitHubにアップロード</button>

  <div class="log" id="log"></div>

  <div class="build-panel" id="buildPanel">
    <div class="build-header">
      <div class="spinner" id="buildSpinner"></div>
      <span id="buildHeaderText">ビルド状況を確認中...</span>
    </div>
    <div class="build-status" id="buildStatus"></div>
  </div>

  <a class="open-link" id="openLink" href="https://kuroreko.web.app" target="_blank">
    ✅ デプロイ完了！アプリを開く →
  </a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const OWNER  = 'sharpcraft0826-create';
const REPO   = 'kuroreko';
const BRANCH = 'main';

const tokenInput      = document.getElementById('token');
const eyeBtn          = document.getElementById('eyeBtn');
const uploadArea      = document.getElementById('uploadArea');
const fileInput       = document.getElementById('fileInput');
const fileName        = document.getElementById('fileName');
const deployBtn       = document.getElementById('deployBtn');
const log             = document.getElementById('log');
const buildPanel      = document.getElementById('buildPanel');
const buildStatus     = document.getElementById('buildStatus');
const buildHeaderText = document.getElementById('buildHeaderText');
const buildSpinner    = document.getElementById('buildSpinner');
const openLink        = document.getElementById('openLink');

let selectedFile = null;
let pollTimer    = null;

// トークン表示/非表示
eyeBtn.addEventListener('click', () => {
  const isHidden = tokenInput.type === 'password';
  tokenInput.type = isHidden ? 'text' : 'password';
  eyeBtn.textContent = isHidden ? '🙈' : '👁';
});

tokenInput.addEventListener('input', updateBtn);

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.zip')) setFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) setFile(e.target.files[0]); });

function setFile(file) {
  selectedFile = file;
  fileName.textContent = '📄 ' + file.name;
  fileName.style.display = 'block';
  updateBtn();
}

function updateBtn() {
  deployBtn.disabled = !(selectedFile && tokenInput.value.trim());
}

function addLog(msg) {
  log.style.display = 'block';
  log.innerHTML += msg + '<br>';
  log.scrollTop = log.scrollHeight;
}

function getToken() { return tokenInput.value.trim(); }

async function getFileSha(path) {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,
      { headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (res.status === 404) return null;
    const data = await res.json();
    return data.sha;
  } catch { return null; }
}

async function uploadFile(path, content) {
  const sha = await getFileSha(path);
  const body = { message: `update: ${path}`, content, branch: BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `token ${getToken()}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    }
  );
  if (!res.ok) { const e = await res.json(); throw new Error(e.message); }
}

async function pollBuildStatus() {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?branch=${BRANCH}&per_page=1`,
      { headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json' } }
    );
    const data = await res.json();
    const run = data.workflow_runs?.[0];
    if (!run) return;

    const status     = run.status;
    const conclusion = run.conclusion;
    const startedAt  = run.run_started_at ? new Date(run.run_started_at) : null;
    const elapsed    = startedAt ? Math.floor((new Date() - startedAt) / 1000) : 0;
    const elapsedStr = startedAt ? `${Math.floor(elapsed/60)}分${elapsed%60}秒` : '-';

    let dotClass = 'waiting', headerText = '確認中...', isDone = false, statusText = '';

    if (status === 'queued')       { dotClass = 'waiting'; headerText = '⏳ 待機中...';    statusText = '待機中'; }
    else if (status === 'in_progress') { dotClass = 'running'; headerText = '🔨 ビルド中...'; statusText = 'ビルド中'; }
    else if (status === 'completed') {
      isDone = true;
      if (conclusion === 'success') {
        dotClass = 'success'; headerText = '🎉 デプロイ完了！'; statusText = '✅ 成功';
        buildSpinner.style.display = 'none';
        openLink.style.display = 'block';
        clearInterval(pollTimer);
      } else {
        dotClass = 'failure'; headerText = '❌ ビルド失敗'; statusText = '❌ 失敗';
        buildSpinner.style.display = 'none';
        clearInterval(pollTimer);
      }
    }

    buildHeaderText.textContent = headerText;
    buildStatus.innerHTML = `
      <div class="row"><span class="label">状況</span><span class="dot ${dotClass}"></span><span class="value">${statusText}</span></div>
      <div class="row"><span class="label">経過時間</span><span class="value">${elapsedStr}</span></div>
      ${isDone && conclusion !== 'success' ? '<div class="row" style="color:#ef4444;font-size:12px;margin-top:4px;">GitHubのActionsタブでエラーを確認してください</div>' : ''}
    `;
  } catch(e) { console.error(e); }
}

deployBtn.addEventListener('click', async () => {
  if (!selectedFile || !getToken()) return;
  deployBtn.disabled = true;
  log.innerHTML = '';
  log.style.display = 'block';
  openLink.style.display = 'none';
  buildPanel.style.display = 'none';

  try {
    addLog('📦 ZIPを解析中...');
    const zip = await JSZip.loadAsync(selectedFile);
    const files = [];
    zip.forEach((p, e) => { if (!e.dir) files.push({ path: p, entry: e }); });

    const targets = files.filter(f =>
      f.path.match(/^(lib|assets|web)\//) ||
      f.path === 'pubspec.yaml' || f.path === 'pubspec.lock'
    );

    addLog(`✅ ${targets.length}ファイルを検出`);
    let success = 0;
    for (const file of targets) {
      const content = await file.entry.async('base64');
      await uploadFile(file.path, content);
      addLog(`⬆️ ${file.path}`);
      success++;
    }

    addLog(`\n🎉 ${success}ファイルをアップロード完了`);
    addLog('⏳ GitHub Actionsでビルド開始...');

    buildPanel.style.display = 'block';
    buildSpinner.style.display = 'inline-block';
    buildHeaderText.textContent = 'ビルド開始待ち...';
    buildStatus.innerHTML = '';

    setTimeout(() => {
      pollBuildStatus();
      pollTimer = setInterval(pollBuildStatus, 10000);
    }, 5000);

  } catch (e) {
    addLog('❌ エラー: ' + e.message);
  }
  deployBtn.disabled = false;
});
</script>
</body>
</html>
