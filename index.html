<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クロレコ デプロイツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    color: #E8201A;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 28px;
  }
  .section { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  .upload-area {
    border: 2px dashed #ddd;
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafa;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #E8201A;
    background: #fff5f5;
  }
  .upload-area .icon { font-size: 40px; margin-bottom: 10px; }
  .upload-area .text { color: #666; font-size: 14px; }
  .upload-area .hint { color: #aaa; font-size: 12px; margin-top: 4px; }
  .file-name {
    margin-top: 10px;
    padding: 8px 12px;
    background: #f0f8ff;
    border-radius: 8px;
    font-size: 13px;
    color: #333;
    display: none;
  }
  .btn {
    width: 100%;
    padding: 15px;
    background: #E8201A;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .log {
    margin-top: 20px;
    padding: 14px;
    background: #1a1a1a;
    border-radius: 10px;
    font-size: 12px;
    font-family: monospace;
    color: #00ff88;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    line-height: 1.8;
  }
  .status {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
  }
  .status.success { color: #22c55e; }
  .status.error { color: #ef4444; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">クロレコ</div>
  <div class="subtitle">デプロイツール</div>

  <div class="section">
    <label>ZIPファイルを選択</label>
    <div class="upload-area" id="uploadArea">
      <div class="icon">📦</div>
      <div class="text">タップしてZIPを選択</div>
      <div class="hint">Claudeからダウンロードしたzipファイル</div>
    </div>
    <div class="file-name" id="fileName"></div>
    <input type="file" id="fileInput" accept=".zip">
  </div>

  <button class="btn" id="deployBtn" disabled>GitHubにアップロード</button>

  <div class="log" id="log"></div>
  <div class="status" id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const OWNER  = 'sharpcraft0826-create';
const REPO   = 'kuroreko';
const BRANCH = 'main';
const TOKEN  = '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';

const uploadArea = document.getElementById('uploadArea');
const fileInput  = document.getElementById('fileInput');
const fileName   = document.getElementById('fileName');
const deployBtn  = document.getElementById('deployBtn');
const log        = document.getElementById('log');
const status     = document.getElementById('status');

let selectedFile = null;

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.zip')) setFile(file);
});

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});

function setFile(file) {
  selectedFile = file;
  fileName.textContent = '📄 ' + file.name;
  fileName.style.display = 'block';
  deployBtn.disabled = false;
}

function addLog(msg) {
  log.style.display = 'block';
  log.innerHTML += msg + '<br>';
  log.scrollTop = log.scrollHeight;
}

async function getFileSha(path) {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,
      { headers: { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (res.status === 404) return null;
    const data = await res.json();
    return data.sha;
  } catch { return null; }
}

async function uploadFile(path, content) {
  const sha = await getFileSha(path);
  const body = {
    message: `update: ${path}`,
    content: content,
    branch: BRANCH,
  };
  if (sha) body.sha = sha;

  const res = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `token ${TOKEN}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    }
  );
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || res.statusText);
  }
  return true;
}

deployBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  deployBtn.disabled = true;
  log.innerHTML = '';
  log.style.display = 'block';
  status.style.display = 'none';

  try {
    addLog('📦 ZIPを解析中...');
    const zip = await JSZip.loadAsync(selectedFile);
    const files = [];

    zip.forEach((relativePath, zipEntry) => {
      if (!zipEntry.dir) files.push({ path: relativePath, entry: zipEntry });
    });

    const targets = files.filter(f =>
      f.path.match(/^(lib|assets|web)\//) ||
      f.path === 'pubspec.yaml' ||
      f.path === 'pubspec.lock'
    );

    addLog(`✅ ${targets.length}ファイルを検出`);

    let success = 0;
    for (const file of targets) {
      try {
        const content = await file.entry.async('base64');
        await uploadFile(file.path, content);
        addLog(`⬆️ ${file.path}`);
        success++;
      } catch (e) {
        addLog(`❌ ${file.path}: ${e.message}`);
      }
    }

    addLog(`\n🎉 完了！ ${success}/${targets.length}ファイルをアップロード`);
    addLog('⏳ GitHub Actionsでビルド中... 3〜5分後に反映されます');

    status.textContent = '✅ アップロード完了！3〜5分後に反映されます';
    status.className = 'status success';
    status.style.display = 'block';

  } catch (e) {
    addLog('❌ エラー: ' + e.message);
    status.textContent = '❌ エラーが発生しました';
    status.className = 'status error';
    status.style.display = 'block';
  }

  deployBtn.disabled = false;
});
</script>
</body>
</html>
